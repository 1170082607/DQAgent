[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dqagent"
version = "0.7.0"
description = "An incremental, engineering-first AI Agent learning project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "DQAgent contributors" }]
dependencies = [
    "jsonschema>=4.23,<5.0",
    "openai>=2.45.0,<3.0.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.3,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.12,<1.0",
    "types-jsonschema>=4.23,<5.0",
]

[project.scripts]
dqagent = "dqagent.cli:main"
dqagent-eval = "dqagent.evaluation_cli:main"
dqagent-context-eval = "dqagent.context_evaluation_cli:main"
dqagent-index = "dqagent.retrieval_cli:main"
dqagent-retrieval-eval = "dqagent.retrieval_evaluation_cli:main"
dqagent-rag-answer-eval = "dqagent.retrieval_answer_evaluation_cli:main"
dqagent-memory = "dqagent.memory_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=dqagent --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dqagent"]
