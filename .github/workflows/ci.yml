name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest

      - name: Deterministic evaluation
        run: |
          dqagent-eval \
            --mode deterministic \
            --output evaluation-report.json
          dqagent-context-eval \
            --output context-evaluation-report.json
          dqagent-retrieval-eval \
            --output retrieval-evaluation-report.json
          dqagent-memory-eval \
            --output memory-evaluation-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-evaluation-report
          path: |
            evaluation-report.json
            context-evaluation-report.json
            retrieval-evaluation-report.json
            memory-evaluation-report.json
          retention-days: 30
